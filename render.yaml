services:
  # Backend API service (FastAPI)
  - type: web
    name: chatbot-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LLM_API_KEYS
        sync: false
      - key: LLM_MODEL
        value: groq/openai/gpt-oss-20b
      - key: LLM_MODELS
        value: groq/openai/gpt-oss-20b,gemini/gemini-3.5-flash-lite
      - key: DATABASE_URL
        value: sqlite:///./app.db
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: ENABLE_FAILURE_SIMULATION
        value: "true"
      - key: DEFAULT_SYSTEM_PROMPT
        value: You are a helpful, concise assistant.

  # Frontend static site (React / Vite)
  # Note: Render static sites are served globally via CDN (no region or plan required).
  - type: web
    name: chatbot-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://chatbot-backend.onrender.com
