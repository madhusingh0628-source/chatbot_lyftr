<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="A multi-key LLM chatbot with response caching, failover and voice." />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>LLM Chatbot</title>
    <script>
      // apply the saved theme before first paint (no light flash in dark mode)
      try {
        var t = JSON.parse(localStorage.getItem("chatbot_theme") || '"system"');
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {
        var raw = null;
        try { raw = localStorage.getItem("chatbot_theme"); } catch (e2) {}
        if (raw === "light" || raw === "dark") document.documentElement.setAttribute("data-theme", raw);
      }
    </script>
  </head>
  <body>
    <noscript>This app needs JavaScript enabled.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
